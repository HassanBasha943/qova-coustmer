<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOVA | Couture Cairo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        qova: {
                            sand: '#F7F4EF',
                            cream: '#FAF8F5',
                            beige: '#E8E2D5',
                            taupe: '#D5C9B8',
                            gold: '#C5A880',
                            charcoal: '#222220',
                            terracotta: '#A65D4C',
                            slate: '#68655F'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #F7F4EF; }
        ::-webkit-scrollbar-thumb { background: #C5A880; border-radius: 3px; }
        .bg-glass { background: rgba(250, 248, 245, 0.94); backdrop-filter: blur(12px); }
    </style>
</head>

<body class="bg-qova-sand text-qova-charcoal font-sans antialiased min-h-screen flex flex-col">

    <!-- Announcement Bar -->
    <div class="bg-qova-charcoal text-qova-sand text-xs tracking-widest uppercase py-2.5 px-4 text-center font-light relative">
        <span>✨ Complimentary express shipping on orders above 2,500 EGP</span>
    </div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 bg-glass border-b border-qova-beige/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between relative">

            <nav class="hidden sm:flex items-center space-x-6 text-xs font-medium uppercase tracking-widest">
                <button type="button" onclick="filterCategory('all')" class="hover:text-qova-gold transition py-1">All</button>
                <button type="button" onclick="filterCategory('hoodie')" class="hover:text-qova-gold transition py-1">Hoodie</button>
                <button type="button" onclick="filterCategory('suit')" class="hover:text-qova-gold transition py-1">Suit</button>
                <button type="button" onclick="filterCategory('outfit')" class="hover:text-qova-gold transition py-1">Outfit</button>
                <button type="button" onclick="filterCategory('t-shirt')" class="hover:text-qova-gold transition py-1">T-Shirt</button>
                <button type="button" onclick="filterCategory('sweetpants')" class="hover:text-qova-gold transition py-1">Sweatpants</button>
            </nav>

            <div class="text-center mx-auto sm:mx-0">
                <a href="#" class="font-serif text-3xl sm:text-4xl tracking-widest font-semibold uppercase text-qova-charcoal flex items-center justify-center gap-2">
                    <span class="text-qova-gold font-light">✦</span>
                    <span>QOVA</span>
                </a>
                <span class="block text-[9px] uppercase tracking-[0.3em] text-qova-slate font-light -mt-1">Couture Cairo</span>
            </div>

            <div class="flex items-center space-x-4">
                <button type="button" onclick="toggleCartDrawer()" class="text-qova-charcoal hover:text-qova-gold transition p-1.5 relative">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-qova-terracotta text-white text-[10px] font-bold w-4.5 h-4.5 rounded-full flex items-center justify-center shadow-sm">0</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Image Lightbox Modal -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <div class="relative max-w-4xl max-h-[90vh] flex items-center justify-center" onclick="event.stopPropagation()">
            <button type="button" onclick="closeImageModal()" class="absolute -top-12 right-0 text-white hover:text-qova-gold text-3xl p-2 focus:outline-none">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="lightbox-img" src="" alt="Full Product View" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl border border-qova-gold/30">
        </div>
    </div>

    <!-- Product Catalog Grid -->
    <section class="py-16 max-w-7xl mx-auto px-4 w-full flex-1">

        <div class="text-center mb-12">
            <span class="text-xs uppercase tracking-[0.3em] text-qova-gold font-medium">Curated Ready-to-Wear</span>
            <h2 class="font-serif text-3xl sm:text-5xl text-qova-charcoal mt-1">QOVA Atelier Selection</h2>
            <div class="w-12 h-0.5 bg-qova-gold mx-auto mt-4"></div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>

    </section>

    <!-- Shopping Bag Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex justify-end">
        <div class="w-full max-w-md bg-qova-cream h-full p-6 flex flex-col shadow-2xl border-l border-qova-beige">

            <div class="flex items-center justify-between pb-4 border-b border-qova-beige">
                <h3 class="font-serif text-2xl text-qova-charcoal">Your Shopping Bag</h3>
                <button type="button" onclick="toggleCartDrawer()" class="text-qova-slate hover:text-qova-charcoal p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div id="cart-items-list" class="flex-1 overflow-y-auto py-4 space-y-4"></div>

            <div class="pt-4 border-t border-qova-beige space-y-3">
                <div class="flex justify-between text-sm font-semibold text-qova-charcoal">
                    <span>Total Subtotal:</span>
                    <span id="cart-total" class="text-qova-gold font-serif text-xl font-bold">0 EGP</span>
                </div>

                <button type="button" onclick="openCheckoutModal()" class="w-full bg-qova-gold text-qova-charcoal py-3.5 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-qova-charcoal hover:text-white transition shadow-lg flex items-center justify-center gap-2">
                    Proceed to Checkout <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-qova-cream w-full max-w-lg max-h-[90vh] rounded-2xl shadow-2xl p-6 relative border border-qova-gold flex flex-col overflow-y-auto">

            <div class="flex items-center justify-between pb-4 border-b border-qova-beige">
                <h3 class="font-serif text-2xl font-bold text-qova-charcoal flex items-center gap-2">
                    <i class="fa-solid fa-credit-card text-qova-gold"></i> Checkout Details
                </h3>

                <button type="button" onclick="closeCheckoutModal()" class="text-qova-slate hover:text-qova-charcoal p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Checkout Form -->
            <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)" class="py-4 space-y-3 text-xs flex-1">

                <div>
                    <label class="block text-qova-slate mb-1">Full Name *</label>
                    <input type="text" id="cust-name" required placeholder="name" class="w-full bg-white border border-qova-beige rounded-lg p-2.5">
                </div>

                <div>
                    <label class="block text-qova-slate mb-1">Phone Number *</label>
                    <input type="tel" id="cust-phone" required placeholder="010XXXXXXXX" class="w-full bg-white border border-qova-beige rounded-lg p-2.5">
                </div>

                <div>
                    <label class="block text-qova-slate mb-1">Email Address *</label>
                    <input type="email" id="cust-email" required placeholder="Email" class="w-full bg-white border border-qova-beige rounded-lg p-2.5">
                </div>

                <!-- Payment Method -->
                <div>
                    <label class="block text-qova-slate mb-1 font-bold text-qova-charcoal">Payment Method *</label>
                    <select id="cust-payment" class="w-full bg-white border border-qova-gold rounded-lg p-2.5 font-semibold text-qova-charcoal">
                        <option value="Cash on Delivery">Cash on Delivery (الدفع عند الاستلام)</option>
                    </select>
                </div>

                <!-- Governorates -->
                <div>
                    <label class="block text-qova-slate mb-1">Governorate (المحافظة) *</label>
                    <select id="cust-gov" class="w-full bg-white border border-qova-beige rounded-lg p-2.5">
                        <option value="Cairo">القاهرة (Cairo)</option>
                        <option value="Giza">الجيزة (Giza)</option>
                        <option value="Alexandria">الإسكندرية (Alexandria)</option>
                        <option value="Qalyubia">القليوبية (Qalyubia)</option>
                        <option value="Gharbia">الغربية (Gharbia)</option>
                        <option value="Dakahlia">الدقهلية / المنصورة (Dakahlia)</option>
                        <option value="Sharqia">الشرقية (Sharqia)</option>
                        <option value="Monufia">المنوفية (Monufia)</option>
                        <option value="Beheira">البحيرة (Beheira)</option>
                        <option value="Kafr El Sheikh">كفر الشيخ (Kafr El Sheikh)</option>
                        <option value="Damietta">دمياط (Damietta)</option>
                        <option value="Port Said">بورسعيد (Port Said)</option>
                        <option value="Ismailia">الإسماعيلية (Ismailia)</option>
                        <option value="Suez">السويس (Suez)</option>
                        <option value="Fayoum">الفيوم (Fayoum)</option>
                        <option value="Beni Suef">بني سويف (Beni Suef)</option>
                        <option value="Minya">المنيا (Minya)</option>
                        <option value="Asyut">أسيوط (Asyut)</option>
                        <option value="Sohag">سوهاج (Sohag)</option>
                        <option value="Qena">قنا (Qena)</option>
                        <option value="Luxor">الأقصر (Luxor)</option>
                        <option value="Aswan">أسوان (Aswan)</option>
                        <option value="Red Sea">البحر الأحمر (Red Sea)</option>
                        <option value="New Valley">الوادي الجديد (New Valley)</option>
                        <option value="Matrouh">مطروح (Matrouh)</option>
                        <option value="North Sinai">شمال سيناء (North Sinai)</option>
                        <option value="South Sinai">جنوب سيناء (South Sinai)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-qova-slate mb-1">Detailed Address *</label>
                    <textarea id="cust-address" required rows="2" placeholder="Street / Building / Floor..." class="w-full bg-white border border-qova-beige rounded-lg p-2.5"></textarea>
                </div>

                <div>
                    <label class="block text-qova-slate mb-1">Delivery Notes (Optional)</label>
                    <input type="text" id="cust-notes" placeholder="e.g. Call before delivery" class="w-full bg-white border border-qova-beige rounded-lg p-2.5">
                </div>

                <div class="pt-3 border-t border-qova-beige flex justify-between text-sm font-semibold text-qova-charcoal">
                    <span>Total Final Amount:</span>
                    <span id="checkout-modal-total" class="text-qova-gold font-serif text-xl font-bold">0 EGP</span>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-qova-gold text-qova-charcoal py-3.5 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-qova-charcoal hover:text-white transition shadow-lg mt-2">
                    Confirm Order
                </button>

            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-qova-charcoal text-white px-5 py-3 rounded-xl shadow-2xl text-xs transition-all duration-300 translate-y-32 opacity-0 border border-qova-gold">
        <span id="toast-message">Action successful!</span>
    </div>

    <!-- Footer -->
    <footer class="bg-qova-charcoal text-qova-sand pt-12 pb-8 border-t border-qova-beige/20 text-center text-xs text-qova-slate">
        <p>©️ 2026 QOVA Modest Wear Cairo. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>
    const SUPABASE_URL = 'https://seiddcpeneobfcpgqbtk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_N9VqWGOsV95ElNOBLy2vng_wqzc9Eb0';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const FALLBACK_IMG = 'https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=800&auto=format&fit=crop';

    const DEFAULT_PRODUCTS = [
        {
            id: 'q1',
            name: 'Executive Tailored Suit',
            category: 'suit',
            price: 3450,
            image: 'https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=800&auto=format&fit=crop',
            fabric: 'Heavyweight Matte Crepe'
        },
        {
            id: 'q2',
            name: 'Sahara Sand Daily Outfit',
            category: 'outfit',
            price: 2850,
            image: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop',
            fabric: '100% Egyptian Linen'
        },
        {
            id: 'q3',
            name: 'Minimalist Cotton T-Shirt',
            category: 't-shirt',
            price: 1200,
            image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800&auto=format&fit=crop',
            fabric: 'Pure Combed Cotton'
        },
        {
            id: 'q4',
            name: 'Comfort Lounge Sweetpants',
            category: 'sweetpants',
            price: 1650,
            image: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=800&auto=format&fit=crop',
            fabric: 'Organic Fleece Blend'
        }
    ];

    let PRODUCTS = [];
    let cart = [];

    const selectedSizes = {};

    // INITIALIZATION
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            cart = JSON.parse(localStorage.getItem('qova_cart') || '[]');
        } catch (error) {
            cart = [];
        }

        await fetchProductsFromDb();
        updateCartUI();
    });

    // PRODUCTS
    async function fetchProductsFromDb() {
        const { data, error } =
            await supabaseClient.from('products').select('*');

        if (error) {
            console.error('Error fetching products:', error);
            PRODUCTS = [...DEFAULT_PRODUCTS];
        } else if (data && data.length > 0) {
            PRODUCTS = data.map(row => ({
                id: row.id,
                ...row.product_data
            }));
        } else {
            PRODUCTS = [...DEFAULT_PRODUCTS];
        }

        renderProducts(PRODUCTS);
    }

    function renderProducts(items) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';

        items.forEach(product => {
            const card = document.createElement('div');

            card.className =
                'group flex flex-col bg-qova-cream rounded-2xl overflow-hidden border border-qova-beige/60 shadow-md transition hover:shadow-xl';

            card.innerHTML = `
                <div class="relative aspect-[3/4] overflow-hidden bg-qova-sand cursor-pointer"
                    onclick="openImageModal('${product.image}')"
                    title="Click to view full image">

                    <img src="${product.image}"
                        onerror="this.onerror=null;this.src='${FALLBACK_IMG}';"
                        alt="${product.name}"
                        class="w-full h-full object-cover group-hover:scale-105 transition duration-500">

                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                        <span class="bg-white/90 text-qova-charcoal px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-md">
                            <i class="fa-solid fa-expand"></i> View Full Image
                        </span>
                    </div>
                </div>

                <div class="p-5 flex flex-col flex-1">
                    <span class="text-[10px] uppercase tracking-widest text-qova-gold font-bold">${product.category}</span>

                    <h3 class="font-serif text-lg text-qova-charcoal font-semibold mt-0.5">
                        ${product.name}
                    </h3>

                    <p class="text-xs text-qova-slate mt-1">
                        ${product.fabric || 'Custom Luxury Tailoring'}
                    </p>

                    <div class="mt-3">
                        <label class="block text-[10px] uppercase tracking-wider text-qova-slate font-semibold mb-1">
                            Select Size:
                        </label>

                        <div class="flex gap-2">
                            <button type="button" onclick="selectSize('${product.id}', 'S', this)"
                                class="size-btn-${product.id} px-2.5 py-1 text-xs border border-qova-beige rounded-lg hover:border-qova-gold transition">S</button>

                            <button type="button" onclick="selectSize('${product.id}', 'M', this)"
                                class="size-btn-${product.id} px-2.5 py-1 text-xs border border-qova-gold bg-qova-gold text-qova-charcoal font-bold rounded-lg transition">M</button>

                            <button type="button" onclick="selectSize('${product.id}', 'L', this)"
                                class="size-btn-${product.id} px-2.5 py-1 text-xs border border-qova-beige rounded-lg hover:border-qova-gold transition">L</button>

                            <button type="button" onclick="selectSize('${product.id}', 'XL', this)"
                                class="size-btn-${product.id} px-2.5 py-1 text-xs border border-qova-beige rounded-lg hover:border-qova-gold transition">XL</button>
                        </div>
                    </div>

                    <div class="mt-auto pt-4 flex items-center justify-between border-t border-qova-beige/50">
                        <span class="font-serif text-lg font-bold text-qova-charcoal">
                            ${product.price} EGP
                        </span>

                        <button type="button" onclick="addToCartWithSelectedSize('${product.id}')"
                            class="bg-qova-gold text-qova-charcoal hover:bg-qova-charcoal hover:text-white px-3.5 py-2 rounded-xl font-bold text-xs transition">
                            Add to Bag
                        </button>
                    </div>
                </div>
            `;

            grid.appendChild(card);
        });
    }

    // CART
    function selectSize(productId, size, btn) {
        selectedSizes[productId] = size;

        document.querySelectorAll(`.size-btn-${productId}`).forEach(button => {
            button.classList.remove('bg-qova-gold', 'text-qova-charcoal', 'font-bold');
            button.classList.add('border-qova-beige');
        });

        btn.classList.add('bg-qova-gold', 'text-qova-charcoal', 'font-bold');
        btn.classList.remove('border-qova-beige');
    }

    function addToCartWithSelectedSize(id) {
        const product = PRODUCTS.find(item => item.id === id);
        if (!product) return;

        const chosenSize = selectedSizes[id] || 'M';
        const itemKey = `${id}-${chosenSize}`;

        const existingItem = cart.find(item => item.itemKey === itemKey);

        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({
                ...product,
                itemKey,
                size: chosenSize,
                quantity: 1
            });
        }

        localStorage.setItem('qova_cart', JSON.stringify(cart));

        updateCartUI();
        showToast(`Added (${chosenSize}) to bag!`);
    }

    function removeFromCart(itemKey) {
        cart = cart.filter(item => item.itemKey !== itemKey);

        localStorage.setItem('qova_cart', JSON.stringify(cart));

        updateCartUI();
        showToast('Item removed from bag');
    }

    function updateCartUI() {
        document.getElementById('cart-badge').innerText =
            cart.reduce((sum, item) => sum + item.quantity, 0);

        const list = document.getElementById('cart-items-list');

        list.innerHTML = cart.length === 0
            ? '<p class="text-center text-xs text-qova-slate py-8">Bag is currently empty.</p>'
            : '';

        let total = 0;

        cart.forEach(item => {
            total += item.price * item.quantity;

            list.innerHTML += `
                <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-qova-beige text-xs">

                    <div>
                        <p class="font-semibold text-qova-charcoal">${item.name}</p>

                        <p class="text-qova-gold font-bold">
                            Size: ${item.size} | ${item.price} EGP × ${item.quantity}
                        </p>
                    </div>

                    <div class="flex items-center gap-3">
                        <span class="font-bold">
                            ${item.price * item.quantity} EGP
                        </span>

                        <button type="button" onclick="removeFromCart('${item.itemKey}')"
                            class="text-red-600 hover:text-red-800 p-1 text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>

                </div>
            `;
        });

        document.getElementById('cart-total').innerText = total + ' EGP';
    }

    // IMAGE AND CATEGORY
    function openImageModal(imgUrl) {
        document.getElementById('lightbox-img').src = imgUrl;
        document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeImageModal() {
        document.getElementById('image-modal').classList.add('hidden');
    }

    function filterCategory(category) {
        if (category === 'all') {
            renderProducts(PRODUCTS);
        } else {
            renderProducts(
                PRODUCTS.filter(product => product.category === category)
            );
        }
    }

    // CHECKOUT
    function openCheckoutModal() {
        if (cart.length === 0) {
            alert('Your shopping bag is empty!');
            return;
        }

        const total = cart.reduce(
            (sum, item) => sum + (item.price * item.quantity), 0
        );

        document.getElementById('checkout-modal-total').innerText = total + ' EGP';

        toggleCartDrawer();

        document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
        document.getElementById('checkout-modal').classList.add('hidden');
    }

    async function handleCheckoutSubmit(e) {
        e.preventDefault();

        if (cart.length === 0) {
            alert('Your shopping bag is empty!');
            return;
        }

        const submitBtn = document.getElementById('submit-btn');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending Order...';

        const total = cart.reduce(
            (sum, item) => sum + (item.price * item.quantity), 0
        );

        const newOrder = {
            id: 'ord-' + Date.now(),

            name: document.getElementById('cust-name').value.trim(),
            phone: document.getElementById('cust-phone').value.trim(),
            email: document.getElementById('cust-email').value.trim(),

            governorate: document.getElementById('cust-gov').value,
            address: document.getElementById('cust-address').value.trim(),

            paymentMethod: document.getElementById('cust-payment').value,

            notes: document.getElementById('cust-notes').value.trim() || 'لا يوجد',

            items: cart.map(item => ({
                name: item.name,
                size: item.size,
                quantity: item.quantity,
                price: item.price
            })),

            total: total + ' EGP',

            date: new Date().toLocaleString()
        };

        try {
            const { data, error } =
                await supabaseClient.functions.invoke(
                    'send-telegram-orders',
                    {
                        body: newOrder
                    }
                );

            if (error) {
                throw error;
            }

            if (!data || data.success !== true) {
                throw new Error(
                    data?.error || 'Telegram sending failed'
                );
            }

            cart = [];

            localStorage.removeItem('qova_cart');

            updateCartUI();

            alert('تم إرسال طلبك بنجاح إلى المتجر ❤️');

            closeCheckoutModal();

            e.target.reset();

        } catch (error) {
            console.error('Order error:', error);

            alert(
                'فشل إرسال الطلب إلى Telegram.\n' +
                'حاول مرة أخرى، ولم يتم حذف منتجات السلة.'
            );

        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Confirm Order';
        }
    }

    // GENERAL UI
    function toggleCartDrawer() {
        document.getElementById('cart-drawer').classList.toggle('hidden');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');

        document.getElementById('toast-message').innerText = msg;

        toast.classList.remove('translate-y-32', 'opacity-0');

        setTimeout(() => {
            toast.classList.add('translate-y-32', 'opacity-0');
        }, 3000);
    }

    </script>
</body>
</html>
